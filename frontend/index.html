<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papoi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1>Papoi</h1>
    <p class="cart-counter">Cart: <span id="cart-count">0</span> item(s)</p>
  </header>

  <nav class="view-nav">
    <button id="view-menu" type="button">Menu</button>
    <button id="view-cart" type="button">Cart</button>
  </nav>

  <main id="menu" class="view"></main>
  <main id="cart-view" class="view hidden"></main>
  <main id="checkout-view" class="view hidden"></main>

  <script src="menu.js"></script>
  <script src="render.js"></script>
  <script src="cart.js"></script>
  <script src="checkout.js"></script>
  <script src="orders.js"></script>
  <script src="app.js"></script>
</body>
</html>
